<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>용어와 정의를 나열하는 태그</title>
</head>
<body>
    <!-- 제목 + 설명 -->
     <!-- dl = 설명 목록 전체를 감싸는 태그  -->
    <dl>
        <!-- dt = 설명할 대상이나 제목  -->
         <dt> <b>html</b>  </dt>
         <!-- dd = 설명 내용  -->
          <dd>웹 페이지의 구조를 만드는 언어 - 즉 뼈대이다. </dd>
    </dl>
    <dl>
        <dt> <b>프로그래밍</b></dt>
            <dd>컴퓨터 프로그램을 작성하는 일 </dd>
        <dt>넓이</dt>
        <dt>광</dt>
        <dt>면적</dt>
            <dd>일정한 평면에 걸쳐 있는 공간이나 범위의 크기</dd>
        <dt>사과</dt>
            <dd>사과나무의 열매 </dd>
            <dd>자신의 잘못을 인정하고 용서를 빎</dd>
    </dl>
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSXkpKmNcvC3LXlmxF2n0i3bdQIsWb3DAvQQSMH2aiJcg&s=10" alt="html 타이틀" title="html">
<br>

</body>
</html>
